version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: graphsentinel-falkordb
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: graphsentinel-backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH=graph_sentinel
      - USE_IN_MEMORY_FALLBACK=false
      - LOG_LEVEL=INFO
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: graphsentinel-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
